<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #4B5563;
            --border-color: #E5E7EB;
            --accent: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }

        /* Fix 1: Constrain the entire app so it doesn't stretch edge-to-edge */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0 auto;
            max-width: 1200px; /* <--- Widen this to 1200px */
            padding: 40px 20px;
            line-height: 1.6;
        }

        h1, h2, h3 { font-weight: 800; letter-spacing: -0.03em; color: var(--text-main); margin-top: 0; }
        h4, h5, strong { font-weight: 600; }
        p { color: var(--text-muted); }
        a { color: var(--text-main); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }

        /* Fix 2: Structure the Login Forms so they stack nicely into center cards */
        form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow-sm);
            margin: 20px 0;
        }
        
        /* Targets your bare login forms to force them into a neat column */
        form:not([style]) {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 400px;
        }

        /* Fix 3: Ensure all inputs cleanly fill their containers */
        input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="datetime-local"], select, textarea {
            width: 100%;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            padding: 12px 16px !important;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color) !important;
            color: var(--text-main);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--text-main) !important;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
        }

        /* Fix 4: Restore button text visibility (fixes the invisible "Upload Asset" text) */
        button, .btn, input[type="submit"] {
            background-color: var(--accent) !important;
            color: #FFFFFF !important; 
            border: none !important;
            padding: 12px 24px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            display: inline-block;
        }

        button:hover, .btn:hover, input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Upgrades your custom bordered containers into padded cards, strictly ignoring progress bars */
        div[style*="border: 1px"]:not([style*="height: 10px"]) {
            background: var(--card-bg) !important;
            border-radius: 12px !important;
            padding: 24px !important;
            box-shadow: var(--shadow-sm) !important;
            border: 1px solid var(--border-color) !important;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
