{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>New Project for {{ client.name }}</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 12px; max-width: 400px;">
        <input type="text" name="name" placeholder="Project Name (Internal)" required>
        <input type="text" name="code_name" placeholder="Project Code Name (e.g. Horizon)" required>
        
        <label for="freelancer_id" style="font-size: 14px; color: #666;">Assign Freelancer (Optional):</label>
        <select name="freelancer_id" id="freelancer_id">
            <option value="">-- No Freelancer Assigned Yet --</option>
            {% for freelancer in freelancers %}
                <option value="{{ freelancer.id }}">{{ freelancer.name }} ({{ freelancer.specialization }})</option>
            {% endfor %}
        </select>
        
        <button type="submit" class="btn" style="background: #1A1A1A; color: #FFF; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Deploy Project</button>
    </form>
</div>
{% endblock %}
