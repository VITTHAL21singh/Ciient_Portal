{% extends "base.html" %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    body { padding: 0 !important; max-width: 100% !important; background-color: #F8F9FA !important; font-family: 'Inter', sans-serif !important; margin: 0; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: #FFF; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #E5E7EB; }
    .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; color: #111827; letter-spacing: -0.03em; }
    .profile-area { display: flex; align-items: center; gap: 16px; color: #111827; }
    .icon-circle, .avatar-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    .icon-circle { border: 1px solid #E5E7EB; background: #FFF; }
    .avatar-circle { background: #E5E7EB; font-weight: 600; }
    
    /* GRID LAYOUT FIXES THE CROOKED ALIGNMENT */
    .dashboard-container { 
        display: grid; 
        grid-template-columns: 240px 1fr; 
        gap: 40px; 
        max-width: 1400px; 
        margin: 40px auto; 
        padding: 0 40px; 
        align-items: start; 
    }
    
    .sidebar { background: #FFF; border-radius: 12px; padding: 24px 0; border: 1px solid #F3F4F6; position: sticky; top: 100px; }
    .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 10px 20px; margin: 4px 16px; border-radius: 8px; color: #4B5563; text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.2s; }
    .sidebar-link:hover { background: #F9FAFB; color: #111827; }
    .sidebar-link.active { background: #F3F4F6; color: #111827; font-weight: 600; }
    .sidebar-link.active svg { stroke: #111827; }
    
    .main-content { min-width: 0; width: 100%; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .btn-dark { background: #111827 !important; color: #FFF !important; padding: 10px 16px !important; border-radius: 8px !important; font-size: 14px !important; text-decoration: none; font-weight: 500 !important; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; }
    
    .ui-card { background: #FFF; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #E5E7EB; }
</style>

<div class="top-nav">
    <div class="logo-area">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        Master Hub
    </div>
    <div class="profile-area">
        <div class="icon-circle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div>
        <div class="avatar-circle">A</div>
        <span style="font-weight: 500; font-size: 14px; cursor: pointer;">Admin ▾</span>
    </div>
</div>

<div class="dashboard-container">
    <div class="sidebar">
        <a href="{{ url_for('admin_dashboard') }}" class="sidebar-link {% if active_page == 'active' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Active
        </a>
        <a href="{{ url_for('admin_projects') }}" class="sidebar-link {% if active_page == 'projects' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> Projects
        </a>
        <a href="{{ url_for('admin_clients_page') }}" class="sidebar-link {% if active_page == 'client' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Client
        </a>
        <a href="{{ url_for('admin_roster') }}" class="sidebar-link {% if active_page == 'roster' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Team Roster
        </a>
        <a href="{{ url_for('admin_assets') }}" class="sidebar-link {% if active_page == 'asset' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg> Asset
        </a>
        <a href="{{ url_for('admin_approvals') }}" class="sidebar-link {% if active_page == 'approvals' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg> Approvals
        </a>
        
        <div style="padding: 16px 24px; margin-top: 16px; border-top: 1px solid #E5E7EB;">
            <a href="{{ url_for('admin_logout') }}" style="color: #EF4444; font-size: 14px; font-weight: 600; text-decoration: none;">Log Out</a>
        </div>
    </div>

    <div class="main-content">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
